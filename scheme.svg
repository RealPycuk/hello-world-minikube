<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#ffffff"/>
  <!-- client -->
  <rect x="24" y="148" width="130" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="89" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Браузер</text>
  <text x="89" y="196" text-anchor="middle" font-size="12" fill="#475569">HTTP-запрос</text>
  <!-- cluster -->
  <rect x="196" y="24" width="640" height="312" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="6 4"/>
  <text x="216" y="50" font-size="14" font-weight="600" fill="#1d4ed8">Minikube (Kubernetes), namespace default</text>
  <!-- tunnel -->
  <rect x="220" y="148" width="150" height="64" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="295" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">minikube service</text>
  <text x="295" y="194" text-anchor="middle" font-size="12" fill="#475569">туннель kube-proxy</text>
  <!-- service -->
  <rect x="410" y="140" width="170" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="495" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Service</text>
  <text x="495" y="187" text-anchor="middle" font-size="12" fill="#1e3a8a">hello-world-service</text>
  <text x="495" y="205" text-anchor="middle" font-size="12" fill="#1e3a8a">ClusterIP :80</text>
  <!-- deployment -->
  <rect x="620" y="70" width="196" height="246" rx="12" fill="#ffffff" stroke="#2563eb"/>
  <text x="718" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Deployment, replicas: 2</text>
  <rect x="640" y="110" width="156" height="78" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="718" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Pod 1</text>
  <text x="718" y="155" text-anchor="middle" font-size="12" fill="#166534">FastAPI :32777</text>
  <text x="718" y="173" text-anchor="middle" font-size="11" fill="#166534">hello-fastapi:v1.0</text>
  <rect x="640" y="214" width="156" height="78" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="718" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Pod 2</text>
  <text x="718" y="259" text-anchor="middle" font-size="12" fill="#166534">FastAPI :32777</text>
  <text x="718" y="277" text-anchor="middle" font-size="11" fill="#166534">hello-fastapi:v1.0</text>
  <!-- arrows -->
  <line x1="154" y1="180" x2="216" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="180" x2="406" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M580 170 C 605 170, 610 149, 636 149" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M580 190 C 605 190, 610 253, 636 253" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="608" y="330" text-anchor="middle" font-size="12" fill="#475569">Service распределяет запросы между подами по label app=hello-world</text>
</svg>
